server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9007}

spring:
  application:
    name: search-service
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # 重试耗尽后 nack 且不 requeue → 走队列 DLX 进 DLQ
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

# ES 走 HTTP REST（教程推荐的上手方式，不引入重型 Java Client）
firefly:
  internal-auth:
    enabled: true
    hmac-secret: ${INTERNAL_HMAC_SECRET}
    skew-sec: 60
  # ES 查询可略慢，读超时默认 5s
  http:
    connect-timeout-ms: ${HTTP_CONNECT_TIMEOUT_MS:2000}
    connection-request-timeout-ms: ${HTTP_CONNECTION_REQUEST_TIMEOUT_MS:1000}
    read-timeout-ms: ${HTTP_READ_TIMEOUT_MS:5000}
    max-total: ${HTTP_MAX_TOTAL:50}
    max-per-route: ${HTTP_MAX_PER_ROUTE:20}
  elasticsearch:
    base-url: ${ES_BASE_URL:http://127.0.0.1:9200}
    note-index: notes
    user-index: users
