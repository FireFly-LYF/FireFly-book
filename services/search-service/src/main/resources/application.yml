server:
  # 仅本机可达，防旁路伪造 X-User-Id；对外只走 Gateway :8080
  address: 127.0.0.1
  port: 9007

spring:
  application:
    name: search-service
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        # 重试耗尽后 nack 且不 requeue → 走队列 DLX 进 DLQ
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

# ES 走 HTTP REST（教程推荐的上手方式，不引入重型 Java Client）
firefly:
  internal-auth:
    enabled: true
    hmac-secret: ${INTERNAL_HMAC_SECRET}
    skew-sec: 60
  elasticsearch:
    base-url: http://127.0.0.1:9200
    note-index: notes
    user-index: users
