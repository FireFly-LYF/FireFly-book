server:
  # 本机默认仅环回；容器/生产用 SERVER_ADDRESS=0.0.0.0 + 仅内网暴露
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9001}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD}

mybatis:
  configuration:
    map-underscore-to-camel-case: true   # user_name ? userName
  type-aliases-package: userservice.entity

# Access JWT 与 Gateway jwt.secret 一致；下游身份靠 internal-auth HMAC
firefly:
  internal-auth:
    enabled: true
    hmac-secret: ${INTERNAL_HMAC_SECRET}
    skew-sec: 60
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 14d
    tenant: tenant-a
