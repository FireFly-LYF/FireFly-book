server:
  # 仅本机可达，防旁路伪造 X-User-Id；对外只走 Gateway :8080
  address: 127.0.0.1
  port: 9001

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: ${RABBITMQ_PASSWORD}

mybatis:
  configuration:
    map-underscore-to-camel-case: true   # user_name ? userName
  type-aliases-package: userservice.entity

# Access JWT 与 Gateway jwt.secret 一致；下游身份靠 internal-auth HMAC
firefly:
  internal-auth:
    enabled: true
    hmac-secret: ${INTERNAL_HMAC_SECRET}
    skew-sec: 60
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 30m
    refresh-ttl: 14d
    tenant: tenant-a
