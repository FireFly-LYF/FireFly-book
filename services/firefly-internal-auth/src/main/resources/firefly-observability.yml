# 各 Java 服务共用：Actuator 健康 / Prometheus 指标 / MDC 日志字段
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:firefly-service}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %5p [%X{requestId:-},%X{userId:-}] %logger{36} - %msg%n"
