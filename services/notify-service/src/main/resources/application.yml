server:
  # 仅本机可达，防旁路伪造 X-User-Id；对外只走 Gateway :8080
  address: 127.0.0.1
  port: 9005

spring:
  application:
    name: notify-service
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/notify?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: notifyservice.entity

firefly:
  internal-auth:
    enabled: true
    hmac-secret: firefly-internal-hmac-dev-change-me!
    skew-sec: 60
