server:
  # 仅本机可达，防旁路伪造 X-User-Id；对外只走 Gateway :8080
  address: 127.0.0.1
  port: 9003

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/media?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: mediaservice.entity

media:
  storage-dir: D:/FireFlyData/media
  public-base-url: http://127.0.0.1:8080/files
  sign-secret: ${MEDIA_SIGN_SECRET}
  sign-ttl-seconds: 3600

firefly:
  internal-auth:
    enabled: true
    hmac-secret: ${INTERNAL_HMAC_SECRET}
    skew-sec: 60
