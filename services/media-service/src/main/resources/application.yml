server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9003}

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/media?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: media-hikari
      maximum-pool-size: ${HIKARI_MAX_POOL:8}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:3000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: mediaservice.entity

media:
  # 本机默认用 user.home，避免 Windows 盘符冒号与 ${VAR:default} 冲突；生产/容器设 MEDIA_STORAGE_DIR
  storage-dir: ${MEDIA_STORAGE_DIR:${user.home}/FireFlyData/media}
  public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://127.0.0.1:8080/files}
  sign-secret: ${MEDIA_SIGN_SECRET}
  sign-ttl-seconds: ${MEDIA_SIGN_TTL_SECONDS:3600}

firefly:
  internal-auth:
    enabled: true
    hmac-secret: ${INTERNAL_HMAC_SECRET}
    skew-sec: 60
