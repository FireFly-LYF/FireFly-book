server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:9002}

spring:
  application:
    name: content-service
  config:
    import: optional:classpath:firefly-observability.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/content?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: content-hikari
      maximum-pool-size: ${HIKARI_MAX_POOL:15}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:3000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:1800000}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: contentservice.entity
firefly:
  internal-auth:
    enabled: true
    hmac-secret: ${INTERNAL_HMAC_SECRET}
    skew-sec: 60
  outbox:
    poll-interval-ms: 2000
    batch-size: 50
    max-attempts: 20
