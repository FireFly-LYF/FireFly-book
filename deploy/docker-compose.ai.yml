# FireFly Python AI 栈（可选；默认建议本机 Python，见 deploy/scripts/start-ai.ps1）
#
# 仅当本机能稳定拉取 python:3.11-slim 时使用 profile ai-docker：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ai.yml --env-file .env --profile ai-docker up -d --build
#
# 与全栈 Java 组合且 AI 仍用本机进程时：不要加 --profile ai-docker，只跑 Java compose + start-ai.ps1

services:
  nsfw-detector:
    profiles: ["ai-docker"]
    image: vxlink/nsfw_detector:v1.12
    container_name: ff-nsfw-detector
    ports:
      - "3333:3333"
    environment:
      # 镜像内已带 Falconsai 权重；离线避免启动时访问 huggingface.co（国内易 SSL 失败）
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    restart: unless-stopped

  moderation-service:
    profiles: ["ai-docker"]
    build:
      context: ../services-ai
      dockerfile: moderation-service/Dockerfile
    container_name: ff-moderation
    ports:
      - "9101:9101"
    environment:
      MODERATION_SERVICE_PORT: "9101"
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      CONTENT_BASE_URL: ${CONTENT_BASE_URL:-http://content-service:9002}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://media-service:9003}
      NSFW_DETECTOR_URL: ${NSFW_DETECTOR_URL:-http://nsfw-detector:3333}
      NSFW_THRESHOLD: ${NSFW_THRESHOLD:-0.5}
      IMAGE_MODERATION_ENABLED: ${IMAGE_MODERATION_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - nsfw-detector
    restart: unless-stopped

  assistant-service:
    profiles: ["ai-docker"]
    build:
      context: ../services-ai
      dockerfile: assistant-service/Dockerfile
    container_name: ff-assistant
    ports:
      - "9102:9102"
    environment:
      ASSISTANT_SERVICE_PORT: "9102"
      SEARCH_BASE_URL: ${SEARCH_BASE_URL:-http://search-service:9007}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
      INTERNAL_AUTH_ENABLED: "true"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SEC: ${LLM_TIMEOUT_SEC:-45}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
      WEB_SEARCH_MAX_RESULTS: ${WEB_SEARCH_MAX_RESULTS:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
