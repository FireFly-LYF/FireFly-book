[project]
name = "assistant-service"
version = "0.1.0"
description = "FireFly AI assistant: grounded search over notes + web"
requires-python = ">=3.11"
dependencies = [
    "firefly-ai-common",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "httpx>=0.27",
    "openai>=1.0",
    "duckduckgo-search>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_service"]

[tool.uv.sources]
firefly-ai-common = { workspace = true }
