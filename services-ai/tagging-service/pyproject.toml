[project]
name = "tagging-service"
version = "0.1.0"
description = "FireFly note tagging worker"
requires-python = ">=3.11"
dependencies = [
    "firefly-ai-common",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tagging_service"]

[tool.uv.sources]
firefly-ai-common = { workspace = true }
