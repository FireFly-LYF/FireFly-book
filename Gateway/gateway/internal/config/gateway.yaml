# Gateway 配置文件
# 启动：在 gateway 目录下执行 go run ./cmd/gateway

server:
  addr: ":8080"

grpc:
  listen: ""
  auth_required: true   # false 则跳过 metadata JWT（仅开发）

tcp:
  listen: ""

# 密钥仅从环境变量注入（启动脚本加载 .env）；禁止在仓库写默认值
jwt:
  secret: "${JWT_SECRET}"
  token_ttl: "30m"   # 与 user-service access-ttl 对齐（Access 短寿命）
  # 业务 /api 强制 JWT；register|login|refresh 白名单放行
  api_required: true

# 运维通道（与 jwt.secret 必须不同）：Admin 前端 /gateway/login + /gateway/*
admin:
  jwt_secret: "${ADMIN_JWT_SECRET}"
  password: "${ADMIN_PASSWORD}"
  token_ttl: "8h"

# 下游身份头：HMAC(userId|ts)，与各 Java firefly.internal-auth.hmac-secret 一致（勿与 jwt.secret 复用）
internal_auth:
  hmac_secret: "${INTERNAL_HMAC_SECRET}"

tenants:
  - tenant-a
  - tenant-b

redis:
  addr: "localhost:6379"

ratelimit:
  # 默认：每用户/IP 约 30 QPS，突发 60；日配额 2 万
  rate: 30
  capacity: 60
  daily_limit: 20000
  # user_ip=登录按 userId，未登录按 IP；也可 ip | tenant
  key_by: user_ip
  # 敏感路径更严（最长前缀优先）
  routes:
    - prefix: /api/user/login
      rate: 5
      capacity: 10
    - prefix: /api/user/register
      rate: 3
      capacity: 6
    - prefix: /api/user/refresh
      rate: 10
      capacity: 20
    - prefix: /api/media
      rate: 10
      capacity: 20
    - prefix: /api/search
      rate: 10
      capacity: 20
    - prefix: /files
      rate: 40
      capacity: 80

circuit_breaker:
  threshold: 5
  cooldown_sec: 30

# 服务注册存储：memory=内存（默认）| mysql=MySQL 持久化
registry:
  type: memory   # 压测/本地无 MySQL 时用 memory；需要持久化再改回 mysql
  dsn: "root:${MYSQL_PASSWORD}@tcp(localhost:3306)/gateway?parseTime=true"

# 保留完整路径：/api/user/** → Java @RequestMapping("/api/user")
proxy:
  strip_prefix: ""
  # 等待上游响应头超时；超时返回 504 并计入熔断（响应体仍可流式转发）
  response_header_timeout_sec: 10

# 按路径转发到不同 Java 服务（第 13 章）
routes:
  - id: user
    prefix: /api/user
    upstreams:
      - http: http://127.0.0.1:9001
        weight: 1
  - id: content
    prefix: /api/note
    upstreams:
      - http: http://127.0.0.1:9002
        weight: 1
  - id: media
    prefix: /api/media
    upstreams:
      - http: http://127.0.0.1:9003
        weight: 1
  - id: media-files
    prefix: /files
    auth: false   # 不强制 JWT；访问控制靠 media SignedFileFilter（exp+sig）
    upstreams:
      - http: http://127.0.0.1:9003
        weight: 1
  - id: social
    prefix: /api/social
    upstreams:
      - http: http://127.0.0.1:9004
        weight: 1
  - id: notify
    prefix: /api/notify
    upstreams:
      - http: http://127.0.0.1:9005
        weight: 1
  - id: feed
    prefix: /api/feed
    upstreams:
      - http: http://127.0.0.1:9006
        weight: 1
  - id: search
    prefix: /api/search
    upstreams:
      - http: http://127.0.0.1:9007
        weight: 1

# gRPC / TCP 演示下游（HTTP 已由 routes 接管；可留空协议字段）
loadbalancer:
  strategy: round_robin
  upstreams:
    - grpc: localhost:50052
      weight: 1
    - tcp: localhost:9010
      weight: 1

security:
  ip_blocklist:
    - "192.168.1.99"
    - "10.0.0.5"

# 浏览器跨域：仅白名单 Origin 可跨域读响应；生产改为正式前端域名，勿用反射 *
cors:
  allow_credentials: true
  allowed_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    # - https://www.example.com
    # - https://example.com
